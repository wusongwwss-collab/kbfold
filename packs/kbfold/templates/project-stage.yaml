# ═══════════════════════════════════════════════════════════════════
# KBFold L0 通用模板 · 项目阶段视图（通用-项目阶段）
# -------------------------------------------------------------------
# 用途：行业不明但明显是长周期项目时的兜底形状（模板路由 C 级）。
#       模板路由优先级：显式声明 > 行业模板 > 本模板 > 文件类型视图；
#       上一级命中就不往下走。
# 一级目录命名：按 00-07 八段编号排序（项目生命周期：启动→规划→执行→
#               监控→收尾→组合/资产/工具）；同级新增目录取最大序号 +1
#               自动补位。
# 规模伸缩：本模板不是固定深度——套用时按库内文件量裁段（见 scale 段）。
# 改模板：全部是 YAML，可 diff、可回粘、可分享回社区；改完先跑
#         `kbfold validate` 校验结构，再重跑 `kbfold plan` 看差异。
# ═══════════════════════════════════════════════════════════════════

version: 1
id: kbfold:generic-stage/v1        # 模板唯一标识；kbfold: 前缀 = 随本仓发布
kind: view                          # view = 按项目阶段看（与文件类型视图对同一批文件各出一候选）
name: 通用-项目阶段
naming_rules: >-                    # 人话规则，会出现在报告里
  一级目录按 00-07 编号排序（项目生命周期：启动→规划→执行→监控→收尾→组合/资产/工具）；
  同级新增目录取最大序号+1 自动补位。

# 目录规模随文件量伸缩：阈值是工程判断，觉得不对直接改这里，不用改代码。
# 文件少却建出几十个空目录，是最典型的「工具比资料还重」。
scale:
  small:  { max_files: 50,   stages: [00, 02, 04], note: "50 个文件以内只长 3 段，目录总数 ≤ 12 个" }
  medium: { max_files: 500,  stages: [00, 01, 02, 03, 04], note: "50–500 个文件长 4–6 段" }
  full:   { stages: all, note: "500 个文件以上才用八段全集" }

# 目录树：八段，段下子项按 00.x 编号
tree:
  - id: s00
    name: 00-项目启动              # 立项到启动会
    children:
      - { id: s0001, name: 00.1-项目章程与立项 }
      - { id: s0002, name: 00.2-可行性研究 }
      - { id: s0003, name: 00.3-相关方识别与分析 }
      - { id: s0004, name: 00.4-启动会议与决策 }

  - id: s01
    name: 01-项目规划              # 范围/进度/成本/质量等九大计划
    children:
      - { id: s0101, name: 01.1-范围 }
      - { id: s0102, name: 01.2-进度 }
      - { id: s0103, name: 01.3-成本 }
      - { id: s0104, name: 01.4-质量 }
      - { id: s0105, name: 01.5-资源 }
      - { id: s0106, name: 01.6-沟通 }
      - { id: s0107, name: 01.7-风险 }
      - { id: s0108, name: 01.8-采购 }
      - { id: s0109, name: 01.9-相关方参与计划 }

  - id: s02
    name: 02-项目执行              # 按计划干活的产物
    children:
      - { id: s0201, name: 02.1-团队组建 }
      - { id: s0202, name: 02.2-可交付成果 }
      - { id: s0203, name: 02.3-沟通发布 }
      - { id: s0204, name: 02.4-采购执行 }
      - { id: s0205, name: 02.5-质量保证 }
      - { id: s0206, name: 02.6-问题冲突 }

  - id: s03
    name: 03-项目监控              # 对照计划的偏差与控制
    children:
      - { id: s0301, name: 03.1-绩效测量报告 }
      - { id: s0302, name: 03.2-变更控制 }
      - { id: s0303, name: 03.3-风险监控 }
      - { id: s0304, name: 03.4-范围核实 }
      - { id: s0305, name: 03.5-进度成本跟踪 }
      - { id: s0306, name: 03.6-相关方监控 }

  - id: s04
    name: 04-项目收尾              # 验收移交到归档关闭
    children:
      - { id: s0401, name: 04.1-成果验收移交 }
      - { id: s0402, name: 04.2-合同收尾 }
      - { id: s0403, name: 04.3-总结复盘 }
      - { id: s0404, name: 04.4-归档关闭 }
      - { id: s0405, name: 04.5-经验教训登记 }

  - id: s05
    name: 05-项目组合与项目集      # 多项目治理层
    children:
      - { id: s0501, name: 05.1-组合筛选 }
      - { id: s0502, name: 05.2-项目集协调 }
      - { id: s0503, name: 05.3-资源池优化 }
      - { id: s0504, name: 05.4-战略对齐收益 }
      - { id: s0505, name: 05.5-组合报告 }

  - id: s06
    name: 06-组织过程资产          # 组织层面沉淀的资产
    children:
      - { id: s0601, name: 06.1-制度流程 }
      - { id: s0602, name: 06.2-历史档案 }
      - { id: s0603, name: 06.3-经验教训库 }
      - { id: s0604, name: 06.4-最佳实践 }
      - { id: s0605, name: 06.5-知识库培训 }

  - id: s07
    name: 07-模板与工具            # 可复用的模板与工具资料
    children:
      - { id: s0701, name: 07.1-项目管理模板 }
      - { id: s0702, name: 07.2-工具指南 }
      - { id: s0703, name: 07.3-检查清单 }
      - { id: s0704, name: 07.4-表格报告模板 }
      - { id: s0705, name: 07.5-软件系统手册 }

# 匹配信号：什么样的库适合本模板（供自动路由判分，命中越多越倾向本模板）
match:
  keywords: ["立项", "验收", "里程碑", "交付"]   # 名称/路径关键词（S2 信号）
  min_docs: 20                                    # 少于此数不建议整树展开（与 scale.small 呼应）
