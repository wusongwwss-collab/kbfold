# ═══════════════════════════════════════════════════════════════════
# KBFold 规则文件全量示例（kbfold.yml）
# -------------------------------------------------------------------
# 规则是 KBFold 的正文。工具本身只做三件事：读规则、判文件、记账。
# 一段话读完：version 是格式版本；root 是扫描根；basis 是兜底模板；
# kbs 下每个知识库带两组「怎么认出我」（detect）和一组「认出来往哪放」
# （paths）。
# 用法：把本文件复制为你要整备的资料目录根部的 kbfold.yml，改成自己的
#       口径 → `kbfold validate` 校验结构 → `kbfold plan` 预演看差异。
# ═══════════════════════════════════════════════════════════════════

version: 1                        # 目前只有 1；不认识的版本直接报错退出，不做猜测性兼容
root: ~/Projects                  # 扫描根目录；相对路径按本文件所在目录解析
basis: kbfold:generic/v1          # L0 通用基底：任何库都没认出来时用它兜底。不可删除、不可改名

kbs:

  # ── 示例一：靠显式标记认出的库（最高置信路径） ──────────────────
  - name: 示例项目                 # 人类可读名字，出现在报告标签里
    id: DEMO-2026                  # 短编号：投影目录前缀与检索时的库过滤
    # template: kbfold:generic-stage/v1   # 可选：指定模板；不写则继承 basis
    detect:
      markers: [".demoproject"]    # 标记文件：目录里见到它即认定，置信 0.95（最高级）
      keywords: ["示例项目", "DEMO-2026"]   # 名称/路径中的关键词：置信 0.80
    paths:
      - match: "**/合同/**"        # glob 写法，基准目录是 root
        to: "06-合同与协议类"       # 普通目录名 = 投影内的目标目录（相对投影根）
      - match: "**/会议记录/**"
        to: "09-沟通与会议类"
      - match: "**/过程稿/**"
        to: "@exclude"             # 永不入投影，但仍登记指纹——将来放开不必重扫全盘
      - match: "**/待定/**"
        to: "@inbox"               # 显式承认「不知道放哪」：进待办队列，附候选与理由

  # ── 示例二：多个库并存，各认各的 ────────────────────────────────
  - name: 部门共享资料
    id: SHARED
    detect:
      keywords: ["共享", "部门资料"]

# ── 三个特殊去向 ────────────────────────────────────────────────────
#   普通目录名：投影里就放这儿（如 "06-合同与协议类"）。
#   @exclude  ：永不入投影（过程稿、缓存、临时导出），但仍进指纹台账。
#   @inbox    ：待办队列，不是垃圾桶；每份带候选与理由，处理一批再跑
#               plan 就会看到它变短。它不自动清空——自动清空等于自动猜。

# ── 冲突怎么裁（同一份文件被多条规则命中时，依次裁决） ──────────────
#   1. 多条路径规则命中 → 最具体的胜：路径段更多者胜；同样多则书写顺序
#      后者覆盖前者（越具体越像人为表态）。
#   2. 具体程度打平 → 不猜，进 _inbox/ 并附两条候选（平手时任何选择都
#      是抛硬币，抛硬币的错误率 50%）。
#   3. S1 显式声明与路径规则冲突 → S1 胜（用户明确写过标记，比路径暗示
#      更可信）。
#   4. 一条都没命中 → 落 basis 通用基底；仍无解 → _inbox/（有兜底但不
#      硬塞）。

# ── 什么名字不许写进 to: ────────────────────────────────────────────
#   data、config、cache、app、docs 这类全行业同名的通用目录名，写进 to:
#   会在启动时直接报错（通用名黑名单内置，无需也不能在本文件里改）：
#
#   ✗ 规则错误：目标目录 "data" 属于通用名黑名单
#     这类目录名不携带任何场景信息，放进规则等于把判定权交给猜测。
#     换成场景名，例如 "01-原始资料/data"。
#
#   为什么：通用名不携带场景信息，把判定权交给它等于没判定。启动时报错，
#   比事后在几千个文件里找那一份好。
