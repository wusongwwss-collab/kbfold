# ═══════════════════════════════════════════════════════════════════
# KBFold L0 通用模板 · 文件类型视图（通用-文件类型）
# -------------------------------------------------------------------
# 用途：散文件模式的最后一道兜底（模板路由 D 级）——保证任何一坨文件
#       都能得到「至少按类型分开」的结果，而不是原封不动。
# 一级目录命名：按 01-12 十二类编号排序（按文档性质：计划/报告/记录/
#               需求/设计/合同/流程/模板/沟通/评审/知识/交付）；同级
#               新增目录取最大序号 +1 自动补位。
# 与项目阶段视图的关系：同一批文件两套视图各出一候选，由模板路由按
#                       优先级与判分取舍（行业不明时阶段视图优先）。
# 改模板：全部是 YAML，可 diff、可回粘、可分享回社区；改完先跑
#         `kbfold validate` 校验结构，再重跑 `kbfold plan` 看差异。
# ═══════════════════════════════════════════════════════════════════

version: 1
id: kbfold:generic-kind/v1         # 模板唯一标识；kbfold: 前缀 = 随本仓发布
kind: generic                       # generic = 按文件类型看（散文件兜底）
name: 通用-文件类型
naming_rules: >-                    # 人话规则，会出现在报告里
  一级目录按 01-12 编号排序（按文档性质：计划/报告/记录/需求/设计/合同/流程/模板/沟通/评审/知识/交付）；
  同级新增目录取最大序号+1 自动补位。

# 目录树：十二类，类下子项按 00.x 式两位编号
tree:
  - id: k01
    name: 01-计划类
    children:
      - { id: k0101, name: 01.1-项目总体计划 }
      - { id: k0102, name: 01.2-进度计划 }
      - { id: k0103, name: 01.3-成本计划 }
      - { id: k0104, name: 01.4-质量计划 }
      - { id: k0105, name: 01.5-资源计划 }
      - { id: k0106, name: 01.6-沟通计划 }
      - { id: k0107, name: 01.7-风险应对计划 }
      - { id: k0108, name: 01.8-采购计划 }
      - { id: k0109, name: 01.9-相关方参与计划 }

  - id: k02
    name: 02-报告类
    children:
      - { id: k0201, name: 02.1-项目状态报告 }
      - { id: k0202, name: 02.2-进度报告 }
      - { id: k0203, name: 02.3-成本绩效报告 }
      - { id: k0204, name: 02.4-风险监控报告 }
      - { id: k0205, name: 02.5-质量报告 }
      - { id: k0206, name: 02.6-问题与偏差报告 }
      - { id: k0207, name: 02.7-阶段结束报告 }
      - { id: k0208, name: 02.8-项目总结报告 }

  - id: k03
    name: 03-记录类
    children:
      - { id: k0301, name: 03.1-工作日志 }
      - { id: k0302, name: 03.2-问题记录 }
      - { id: k0303, name: 03.3-变更记录 }
      - { id: k0304, name: 03.4-决策记录 }
      - { id: k0305, name: 03.5-验收记录 }
      - { id: k0306, name: 03.6-测试记录 }
      - { id: k0307, name: 03.7-缺陷记录 }

  - id: k04
    name: 04-需求与规格类
    children:
      - { id: k0401, name: 04.1-需求文档 }
      - { id: k0402, name: 04.2-需求规格说明书 }
      - { id: k0403, name: 04.3-用户故事 }
      - { id: k0404, name: 04.4-功能规格说明 }
      - { id: k0405, name: 04.5-非功能性需求 }
      - { id: k0406, name: 04.6-需求跟踪矩阵 }

  - id: k05
    name: 05-设计与方案类
    children:
      - { id: k0501, name: 05.1-架构设计文档 }
      - { id: k0502, name: 05.2-详细设计文档 }
      - { id: k0503, name: 05.3-技术方案 }
      - { id: k0504, name: 05.4-原型设计 }
      - { id: k0505, name: 05.5-UI/UX设计稿 }
      - { id: k0506, name: 05.6-数据库设计 }
      - { id: k0507, name: 05.7-接口设计文档 }
      - { id: k0508, name: 05.8-施工组织设计（工程类） }
      - { id: k0509, name: 05.9-专项方案 }

  - id: k06
    name: 06-合同与协议类          # 规则示例：**/合同/** → 06-合同与协议类
    children:
      - { id: k0601, name: 06.1-合同文本 }
      - { id: k0602, name: 06.2-补充协议 }
      - { id: k0603, name: 06.3-保密协议 }
      - { id: k0604, name: 06.4-服务级别协议（SLA） }
      - { id: k0605, name: 06.5-采购订单 }
      - { id: k0606, name: 06.6-合作备忘录 }
      - { id: k0607, name: 06.7-授权书 }

  - id: k07
    name: 07-流程与制度类
    children:
      - { id: k0701, name: 07.1-标准操作流程（SOP） }
      - { id: k0702, name: 07.2-管理制度 }
      - { id: k0703, name: 07.3-规范与标准 }
      - { id: k0704, name: 07.4-政策文件 }
      - { id: k0705, name: 07.5-操作手册 }
      - { id: k0706, name: 07.6-作业指导书 }
      - { id: k0707, name: 07.7-审批流程说明 }

  - id: k08
    name: 08-模板与清单类
    children:
      - { id: k0801, name: 08.1-文档模板 }
      - { id: k0802, name: 08.2-表格模板 }
      - { id: k0803, name: 08.3-检查清单 }
      - { id: k0804, name: 08.4-评估表 }
      - { id: k0805, name: 08.5-调查问卷 }
      - { id: k0806, name: 08.6-审批单模板 }
      - { id: k0807, name: 08.7-报告模板 }

  - id: k09
    name: 09-沟通与会议类
    children:
      - { id: k0901, name: 09.1-会议通知 }
      - { id: k0902, name: 09.2-会议议程 }
      - { id: k0903, name: 09.3-会议纪要 }
      - { id: k0904, name: 09.4-汇报材料（PPT） }
      - { id: k0905, name: 09.5-通知公告 }
      - { id: k0906, name: 09.6-邮件存档 }
      - { id: k0907, name: 09.7-沟通记录 }

  - id: k10
    name: 10-评审与审计类
    children:
      - { id: k1001, name: 10.1-评审报告 }
      - { id: k1002, name: 10.2-审计报告 }
      - { id: k1003, name: 10.3-质量审计记录 }
      - { id: k1004, name: 10.4-风险审计记录 }
      - { id: k1005, name: 10.5-合规评审 }
      - { id: k1006, name: 10.6-技术评审意见 }
      - { id: k1007, name: 10.7-验收评审报告 }

  - id: k11
    name: 11-经验与知识类
    children:
      - { id: k1101, name: 11.1-经验教训 }
      - { id: k1102, name: 11.2-最佳实践 }
      - { id: k1103, name: 11.3-案例研究 }
      - { id: k1104, name: 11.4-常见问题（FAQ） }
      - { id: k1105, name: 11.5-培训材料 }
      - { id: k1106, name: 11.6-知识文章 }
      - { id: k1107, name: 11.7-复盘报告 }

  - id: k12
    name: 12-交付物与成果类
    children:
      - { id: k1201, name: 12.1-产品/系统交付物 }
      - { id: k1202, name: 12.2-源代码（打包） }
      - { id: k1203, name: 12.3-用户手册 }
      - { id: k1204, name: 12.4-培训手册 }
      - { id: k1205, name: 12.5-运维手册 }
      - { id: k1206, name: 12.6-安装部署文档 }
      - { id: k1207, name: 12.7-最终验收报告 }
      - { id: k1208, name: 12.8-项目档案归档包 }

# 匹配信号：什么样的库适合本模板（供自动路由判分，命中越多越倾向本模板）
match:
  keywords: ["合同", "报告", "纪要", "验收", "手册"]
